name: pixelopen.kirby-uikit-builder.logo_grid.name
icon: grid

tabs:

  content:
    label: pixelopen.kirby-uikit-builder.tab.content
    fields:

      items:
        type: structure
        label: pixelopen.kirby-uikit-builder.logo_grid.items.label
        columns:
          logo:
            width: 1/4
          name:
            width: 1/2
          url:
            width: 1/4
        fields:
          logo:
            type: files
            label: pixelopen.kirby-uikit-builder.logo_grid.item.logo.label
            max: 1
            query: page.files.filterBy("type", "image")
          name:
            type: text
            label: pixelopen.kirby-uikit-builder.logo_grid.item.name.label
          url:
            type: url
            label: pixelopen.kirby-uikit-builder.logo_grid.item.url.label

  settings:
    label: pixelopen.kirby-uikit-builder.tab.settings
    fields:

      cols_mobile:
        type: select
        label: pixelopen.kirby-uikit-builder.logo_grid.cols.mobile
        width: 1/4
        default: "1-3"
        options:
          - value: "1-2"
            text: "2"
          - value: "1-3"
            text: "3"

      cols_tablet:
        type: select
        label: pixelopen.kirby-uikit-builder.logo_grid.cols.tablet
        width: 1/4
        default: "1-4"
        options:
          - value: "1-3"
            text: "3"
          - value: "1-4"
            text: "4"
          - value: "1-5"
            text: "5"

      cols_desktop:
        type: select
        label: pixelopen.kirby-uikit-builder.logo_grid.cols.desktop
        width: 1/4
        default: "1-5"
        options:
          - value: "1-4"
            text: "4"
          - value: "1-5"
            text: "5"
          - value: "1-6"
            text: "6"

      gap:
        type: select
        label: pixelopen.kirby-uikit-builder.carousel.gap.label
        width: 1/4
        options:
          - value: ""
            text: pixelopen.kirby-uikit-builder.carousel.gap.default
          - value: small
            text: pixelopen.kirby-uikit-builder.carousel.gap.small
          - value: medium
            text: pixelopen.kirby-uikit-builder.carousel.gap.medium
          - value: large
            text: pixelopen.kirby-uikit-builder.carousel.gap.large

      height:
        type: number
        label: pixelopen.kirby-uikit-builder.logo_grid.height.label
        width: 1/4
        default: 60
        min: 20
        max: 200

      grayscale:
        type: toggle
        label: pixelopen.kirby-uikit-builder.logo_grid.grayscale.label
        default: false
        width: 1/4

      opacity:
        type: number
        label: pixelopen.kirby-uikit-builder.logo_grid.opacity.label
        width: 1/4
        default: 100
        min: 30
        max: 100
