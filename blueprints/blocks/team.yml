name: pixelopen.kirby-uikit-builder.team.name
icon: users

tabs:

  content:
    label: pixelopen.kirby-uikit-builder.tab.content
    fields:

      items:
        type: structure
        label: pixelopen.kirby-uikit-builder.team.items.label
        columns:
          name:
            width: 1/2
          role:
            width: 1/2
        fields:
          photo:
            type: files
            label: pixelopen.kirby-uikit-builder.team.item.photo.label
            max: 1
            query: page.files.filterBy("type", "image")
          name:
            type: text
            label: pixelopen.kirby-uikit-builder.team.item.name.label
          role:
            type: text
            label: pixelopen.kirby-uikit-builder.team.item.role.label
          bio:
            type: writer
            label: pixelopen.kirby-uikit-builder.team.item.bio.label
            marks:
              - bold
              - italic
              - link
          link_linkedin:
            type: url
            label: pixelopen.kirby-uikit-builder.team.item.link_linkedin.label
            width: 1/2
          link_twitter:
            type: url
            label: pixelopen.kirby-uikit-builder.team.item.link_twitter.label
            width: 1/2
          link_github:
            type: url
            label: pixelopen.kirby-uikit-builder.team.item.link_github.label
            width: 1/2
          link_instagram:
            type: url
            label: pixelopen.kirby-uikit-builder.team.item.link_instagram.label
            width: 1/2
          link_email:
            type: email
            label: pixelopen.kirby-uikit-builder.team.item.link_email.label
            width: 1/2
          link_website:
            type: url
            label: pixelopen.kirby-uikit-builder.team.item.link_website.label
            width: 1/2

  settings:
    label: pixelopen.kirby-uikit-builder.tab.settings
    fields:

      cols_tablet:
        type: select
        label: pixelopen.kirby-uikit-builder.team.cols.tablet
        width: 1/4
        default: "1-2"
        options:
          - value: "1-1"
            text: "1"
          - value: "1-2"
            text: "2"
          - value: "1-3"
            text: "3"

      cols_desktop:
        type: select
        label: pixelopen.kirby-uikit-builder.team.cols.desktop
        width: 1/4
        default: "1-4"
        options:
          - value: "1-2"
            text: "2"
          - value: "1-3"
            text: "3"
          - value: "1-4"
            text: "4"

      photo_ratio:
        type: select
        label: pixelopen.kirby-uikit-builder.team.photo_ratio.label
        width: 1/4
        default: square
        options:
          - value: square
            text: pixelopen.kirby-uikit-builder.team.photo_ratio.square
          - value: portrait
            text: pixelopen.kirby-uikit-builder.team.photo_ratio.portrait
          - value: landscape
            text: pixelopen.kirby-uikit-builder.team.photo_ratio.landscape

      style:
        type: select
        label: pixelopen.kirby-uikit-builder.icon_box.style.label
        width: 1/4
        options:
          - value: ""
            text: pixelopen.kirby-uikit-builder.icon_box.style.plain
          - value: card
            text: pixelopen.kirby-uikit-builder.icon_box.style.card

      gap:
        type: select
        label: pixelopen.kirby-uikit-builder.carousel.gap.label
        width: 1/4
        options:
          - value: ""
            text: pixelopen.kirby-uikit-builder.carousel.gap.default
          - value: collapse
            text: pixelopen.kirby-uikit-builder.carousel.gap.none
          - value: small
            text: pixelopen.kirby-uikit-builder.carousel.gap.small
          - value: medium
            text: pixelopen.kirby-uikit-builder.carousel.gap.medium
          - value: large
            text: pixelopen.kirby-uikit-builder.carousel.gap.large

      show_bio:
        type: toggle
        label: pixelopen.kirby-uikit-builder.team.show_bio.label
        default: true
        width: 1/4

      show_social:
        type: toggle
        label: pixelopen.kirby-uikit-builder.team.show_social.label
        default: true
        width: 1/4
