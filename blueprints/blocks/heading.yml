        text: pixelopen.kirby-uikit-builder.col.inherit
      - value: " uk-h1"
        text: "H1"
      - value: " uk-h2"
        text: "H2"
      - value: " uk-h3"
        text: "H3"
      - value: " uk-h4"
        text: "H4"
      - value: " uk-h5"
        text: "H5"
      - value: " uk-h6"
        text: "H6"
