name: pixelopen.kirby-uikit-builder.cta.name
icon: megaphone

tabs:

  content:
    label: pixelopen.kirby-uikit-builder.tab.content
    fields:

      heading:
        type: text
        label: pixelopen.kirby-uikit-builder.cta.heading.label

      subtext:
        type: writer
        label: pixelopen.kirby-uikit-builder.cta.subtext.label
        marks:
          - bold
          - italic
          - link

      btn1_label:
        type: text
        label: pixelopen.kirby-uikit-builder.cta.btn1.label
        width: 1/2

      btn1_link_type:
        type: select
        label: pixelopen.kirby-uikit-builder.cta.btn1_link.label
        default: internal
        width: 1/4
        options:
          - value: internal
            text: pixelopen.kirby-uikit-builder.btn.link_type.internal
          - value: url
            text: URL
          - value: anchor
            text: pixelopen.kirby-uikit-builder.btn.link_type.anchor
          - value: file
            text: pixelopen.kirby-uikit-builder.btn.link_type.file
          - value: email
            text: pixelopen.kirby-uikit-builder.btn.link_type.email
          - value: telephone
            text: pixelopen.kirby-uikit-builder.btn.link_type.telephone

      btn1_target:
        type: toggle
        label: pixelopen.kirby-uikit-builder.btn.target
        default: false
        width: 1/4

      btn1_link_page:
        type: pages
        label: pixelopen.kirby-uikit-builder.btn.link_page
        multiple: false
        width: 1/2
        when:
          btn1_link_type: internal

      btn1_link_url:
        type: url
        label: URL
        width: 1/2
        when:
          btn1_link_type: url

      btn1_link_anchor:
        type: slug
        label: pixelopen.kirby-uikit-builder.btn.link_anchor
        before: "#"
        icon: none
        width: 1/2
        when:
          btn1_link_type: anchor

      btn1_link_file:
        type: files
        label: pixelopen.kirby-uikit-builder.btn.link_file
        multiple: false
        width: 1/2
        when:
          btn1_link_type: file

      btn1_link_email:
        type: email
        label: pixelopen.kirby-uikit-builder.btn.link_email
        width: 1/2
        when:
          btn1_link_type: email

      btn1_link_phone:
        type: tel
        label: pixelopen.kirby-uikit-builder.btn.link_phone
        width: 1/2
        when:
          btn1_link_type: telephone

      btn1_style:
        type: select
        label: pixelopen.kirby-uikit-builder.cta.btn1_style.label
        width: 1/2
        default: "uk-button-primary"
        options:
          - value: "uk-button-default"
            text: pixelopen.kirby-uikit-builder.btn.style.default
          - value: "uk-button-primary"
            text: pixelopen.kirby-uikit-builder.btn.style.primary
          - value: "uk-button-secondary"
            text: pixelopen.kirby-uikit-builder.btn.style.secondary
          - value: "uk-button-danger"
            text: pixelopen.kirby-uikit-builder.btn.style.danger
          - value: "uk-button-text"
            text: pixelopen.kirby-uikit-builder.btn.style.text
          - value: "uk-button-link"
            text: pixelopen.kirby-uikit-builder.btn.style.link

      btn2_label:
        type: text
        label: pixelopen.kirby-uikit-builder.cta.btn2.label
        width: 1/2

      btn2_link_type:
        type: select
        label: pixelopen.kirby-uikit-builder.cta.btn2_link.label
        default: internal
        width: 1/4
        options:
          - value: internal
            text: pixelopen.kirby-uikit-builder.btn.link_type.internal
          - value: url
            text: URL
          - value: anchor
            text: pixelopen.kirby-uikit-builder.btn.link_type.anchor
          - value: file
            text: pixelopen.kirby-uikit-builder.btn.link_type.file
          - value: email
            text: pixelopen.kirby-uikit-builder.btn.link_type.email
          - value: telephone
            text: pixelopen.kirby-uikit-builder.btn.link_type.telephone

      btn2_target:
        type: toggle
        label: pixelopen.kirby-uikit-builder.btn.target
        default: false
        width: 1/4

      btn2_link_page:
        type: pages
        label: pixelopen.kirby-uikit-builder.btn.link_page
        multiple: false
        width: 1/2
        when:
          btn2_link_type: internal

      btn2_link_url:
        type: url
        label: URL
        width: 1/2
        when:
          btn2_link_type: url

      btn2_link_anchor:
        type: slug
        label: pixelopen.kirby-uikit-builder.btn.link_anchor
        before: "#"
        icon: none
        width: 1/2
        when:
          btn2_link_type: anchor

      btn2_link_file:
        type: files
        label: pixelopen.kirby-uikit-builder.btn.link_file
        multiple: false
        width: 1/2
        when:
          btn2_link_type: file

      btn2_link_email:
        type: email
        label: pixelopen.kirby-uikit-builder.btn.link_email
        width: 1/2
        when:
          btn2_link_type: email

      btn2_link_phone:
        type: tel
        label: pixelopen.kirby-uikit-builder.btn.link_phone
        width: 1/2
        when:
          btn2_link_type: telephone

      btn2_style:
        type: select
        label: pixelopen.kirby-uikit-builder.cta.btn2_style.label
        width: 1/2
        default: "uk-button-default"
        options:
          - value: "uk-button-default"
            text: pixelopen.kirby-uikit-builder.btn.style.default
          - value: "uk-button-primary"
            text: pixelopen.kirby-uikit-builder.btn.style.primary
          - value: "uk-button-secondary"
            text: pixelopen.kirby-uikit-builder.btn.style.secondary
          - value: "uk-button-danger"
            text: pixelopen.kirby-uikit-builder.btn.style.danger
          - value: "uk-button-text"
            text: pixelopen.kirby-uikit-builder.btn.style.text
          - value: "uk-button-link"
            text: pixelopen.kirby-uikit-builder.btn.style.link

  settings:
    label: pixelopen.kirby-uikit-builder.tab.settings
    fields:

      style:
        type: select
        label: pixelopen.kirby-uikit-builder.cta.style.label
        width: 1/2
        options:
          - value: ""
            text: pixelopen.kirby-uikit-builder.cta.style.plain
          - value: card
            text: pixelopen.kirby-uikit-builder.cta.style.card
          - value: primary
            text: pixelopen.kirby-uikit-builder.cta.style.primary
          - value: secondary
            text: pixelopen.kirby-uikit-builder.cta.style.secondary

      alignment:
        type: select
        label: pixelopen.kirby-uikit-builder.cta.alignment.label
        width: 1/2
        default: "uk-text-center"
        options:
          - value: ""
            text: pixelopen.kirby-uikit-builder.grid_halign.left
          - value: "uk-text-center"
            text: pixelopen.kirby-uikit-builder.grid_halign.center
          - value: "uk-text-right"
            text: pixelopen.kirby-uikit-builder.grid_halign.right
