name: pixelopen.kirby-uikit-builder.pricing.name
icon: money

tabs:

  content:
    label: pixelopen.kirby-uikit-builder.tab.content
    fields:

      items:
        type: structure
        label: pixelopen.kirby-uikit-builder.pricing.items.label
        columns:
          name:
            width: 1/4
          price:
            width: 1/4
          btn_label:
            width: 1/4
          highlighted:
            width: 1/4
        fields:
          name:
            type: text
            label: pixelopen.kirby-uikit-builder.pricing.item.name.label
          price:
            type: text
            label: pixelopen.kirby-uikit-builder.pricing.item.price.label
          period:
            type: text
            label: pixelopen.kirby-uikit-builder.pricing.item.period.label
          description:
            type: text
            label: pixelopen.kirby-uikit-builder.pricing.item.description.label
          features:
            type: textarea
            label: pixelopen.kirby-uikit-builder.pricing.item.features.label
            help: pixelopen.kirby-uikit-builder.pricing.item.features.help
            buttons: false
          btn_label:
            type: text
            label: pixelopen.kirby-uikit-builder.pricing.item.btn_label.label
          link_type:
            type: select
            label: pixelopen.kirby-uikit-builder.pricing.item.link.label
            default: internal
            options:
              - value: internal
                text: pixelopen.kirby-uikit-builder.btn.link_type.internal
              - value: url
                text: URL
              - value: anchor
                text: pixelopen.kirby-uikit-builder.btn.link_type.anchor
              - value: file
                text: pixelopen.kirby-uikit-builder.btn.link_type.file
              - value: email
                text: pixelopen.kirby-uikit-builder.btn.link_type.email
              - value: telephone
                text: pixelopen.kirby-uikit-builder.btn.link_type.telephone
          link_page:
            type: pages
            label: pixelopen.kirby-uikit-builder.btn.link_page
            multiple: false
            when:
              link_type: internal
          link_url:
            type: url
            label: URL
            when:
              link_type: url
          link_anchor:
            type: slug
            label: pixelopen.kirby-uikit-builder.btn.link_anchor
            before: "#"
            icon: none
            when:
              link_type: anchor
          link_file:
            type: files
            label: pixelopen.kirby-uikit-builder.btn.link_file
            multiple: false
            when:
              link_type: file
          link_email:
            type: email
            label: pixelopen.kirby-uikit-builder.btn.link_email
            when:
              link_type: email
          link_phone:
            type: tel
            label: pixelopen.kirby-uikit-builder.btn.link_phone
            when:
              link_type: telephone
          highlighted:
            type: toggle
            label: pixelopen.kirby-uikit-builder.pricing.item.highlighted.label
            default: false
          badge:
            type: text
            label: pixelopen.kirby-uikit-builder.pricing.item.badge.label

  settings:
    label: pixelopen.kirby-uikit-builder.tab.settings
    fields:

      cols_tablet:
        type: select
        label: pixelopen.kirby-uikit-builder.icon_box.cols.tablet
        width: 1/3
        default: "1-2"
        options:
          - value: "1-1"
            text: "1"
          - value: "1-2"
            text: "2"
          - value: "1-3"
            text: "3"

      cols_desktop:
        type: select
        label: pixelopen.kirby-uikit-builder.icon_box.cols.desktop
        width: 1/3
        default: "1-3"
        options:
          - value: "1-2"
            text: "2"
          - value: "1-3"
            text: "3"
          - value: "1-4"
            text: "4"

      btn_style:
        type: select
        label: pixelopen.kirby-uikit-builder.pricing.btn_style.label
        width: 1/3
        default: "uk-button-primary"
        options:
          - value: "uk-button-default"
            text: pixelopen.kirby-uikit-builder.btn.style.default
          - value: "uk-button-primary"
            text: pixelopen.kirby-uikit-builder.btn.style.primary
          - value: "uk-button-secondary"
            text: pixelopen.kirby-uikit-builder.btn.style.secondary
          - value: "uk-button-danger"
            text: pixelopen.kirby-uikit-builder.btn.style.danger

      highlighted_style:
        type: select
        label: pixelopen.kirby-uikit-builder.pricing.highlighted_style.label
        width: 1/3
        default: primary
        options:
          - value: primary
            text: pixelopen.kirby-uikit-builder.cta.style.primary
          - value: secondary
            text: pixelopen.kirby-uikit-builder.cta.style.secondary
