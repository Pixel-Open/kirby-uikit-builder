label: pixelopen.kirby-uikit-builder.tab.content
fields:

  content_position:
    type: select
    label: pixelopen.kirby-uikit-builder.content.position.label
    default: bottom
    options:
      - value: bottom
        text: pixelopen.kirby-uikit-builder.content.position.bottom
      - value: bottom-left
        text: pixelopen.kirby-uikit-builder.content.position.bottom_left
      - value: bottom-center
        text: pixelopen.kirby-uikit-builder.content.position.bottom_center
      - value: bottom-right
